# stable_churn on Binance spot USDC/USDT - FALLBACK if USD1 peg risk is not accepted.
# Evidence: hybrid pacing @ $2M/48h costs 0.016-0.027 bp across two windows => ~$3-5.
# Funding: 50/50 USDC/USDT (or all-USDC: first maker SELL rebalances).
id: stable_churn_usdc
controller_name: stable_churn
controller_type: generic
connector_name: binance
trading_pair: USDC-USDT
volume_target_usd: 2000000
size_all: true
improve_inside: true      # quote one tick inside when the spread is 2+ ticks (one side only at exactly 2)
clip_usd: 400
rebalance_to: 0.9         # paced rebalance moves 90% of the account into the empty side (1 s grid winner, with behind_clips 10)
band_usd: 400
behind_clips: 10        # swept 2/5/10/20 x clip 200/400/800 on 2 windows: 10 x 400 best
taker_imbalance_max: 0.3 # cross only when the hit level is <= 30% of top-of-book size (thin = about to tick our way)
imbalance_valve: 3        # ...unless behind schedule by > 3 x behind_clips x clip
max_fee_bps: 0.5          # FEE KILL-SWITCH: stop forever if the zero-fee promo is not applying
max_drawdown_usd: 20      # 2nd kill-switch, independent of fee reporting (race: normal 48 h P&L is +/-$5)
bootstrap_pair: auto       # funded in another stablecoin (USDC/FDUSD/USD1)? sold into USDT once at start
start_balanced: true      # at start: check balances, one market order to 50/50 (all-USDT deposit buys half USD1)
peg_low: 0.9990
peg_high: 1.0010
pause: false              # LIVE switch: true = cancel all + stand aside (see PARAMS.md)
close_now: false          # LIVE switch: true = rebalance to 50/50 now, then idle
close_base_share: 0.5     # LIVE: what a close rebalances to (0 = all quote, 1 = all base)
close_at_end: false       # no end state: keep churning until the organisers stop the bot
tick_interval_s: 1.0       # Hummingbot standard 1 s cadence (operator: run at 1 s)
race_end_ts: 0            # planned end: only paces the volume schedule (0 = first tick + 48h)
race_duration_s: 172800
stop_lead_s: 900          # then rebalance to 50/50
